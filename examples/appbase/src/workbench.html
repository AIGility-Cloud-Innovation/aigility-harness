<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppBase · 编码工作台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink:#1e293b; --ink2:#64748b; --line:#e8ecf4; --accent:#4f46e5; --soft:#eef0fe; }
body { font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6fb; color:var(--ink); height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
header { background:linear-gradient(120deg,#312e81,#4f46e5 55%,#7c3aed); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
header h1 { font-size:16px; font-weight:700; margin-right:4px; }
header label { font-size:12px; opacity:.85; }
header select, header button { font-family:inherit; font-size:12.5px; border:none; border-radius:8px; padding:7px 10px; cursor:pointer; }
header select { background:rgba(255,255,255,.16); color:#fff; outline:none; }
header select option { color:var(--ink); }
header button { background:rgba(255,255,255,.2); color:#fff; font-weight:600; }
header button:hover { background:rgba(255,255,255,.32); }
header button.on { background:#fff; color:var(--accent); }
.back { text-decoration:none; color:#fff; font-size:12.5px; opacity:.85; }
.back:hover { opacity:1; }
main { flex:1; display:flex; flex-direction:column; max-width:980px; width:100%; margin:0 auto; padding:16px 20px 0; overflow:hidden; }
.tip { font-size:11.5px; color:var(--ink2); padding:0 2px 8px; }
.msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 2px 14px; }
.msg { max-width:80%; padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 2px rgba(15,23,42,.05); }
.msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
.msg.bot { align-self:flex-start; background:#fff; border:1px solid var(--line); }
.inputbar { display:flex; gap:10px; padding:14px 0 18px; }
.inputbar textarea { flex:1; border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; font-family:inherit; font-size:13.5px; resize:none; height:64px; outline:none; }
.inputbar textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3.5px rgba(99,102,241,.12); }
.send { border:none; background:var(--accent); color:#fff; border-radius:12px; padding:0 24px; font-weight:700; cursor:pointer; font-family:inherit; font-size:13.5px; }
.send:disabled { opacity:.55; cursor:wait; }
.progress-bar { align-self:flex-start; font-size:11.5px; color:var(--ink2); background:var(--soft); border-radius:8px; padding:3px 10px; }
.final-prompt { align-self:flex-start; width:92%; background:#fff; border:1.5px solid var(--accent); border-radius:12px; padding:10px 12px; }
.final-prompt pre { white-space:pre-wrap; word-break:break-word; font-size:12.5px; font-family:Consolas,monospace; max-height:260px; overflow-y:auto; margin:0 0 8px; }
.final-prompt button { border:none; background:var(--accent); color:#fff; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
.final-prompt .sub { font-size:11px; color:var(--ink2); margin-top:6px; }
.new-app-card { align-self:flex-start; width:92%; background:#fff; border:1.5px solid var(--accent); border-radius:12px; padding:11px 13px; box-shadow:0 1px 2px rgba(15,23,42,.05); }
.new-app-card .title { font-size:13px; font-weight:700; margin-bottom:5px; }
.new-app-card .sub { font-size:11.5px; color:var(--ink2); margin-bottom:9px; }
.new-app-card .row { display:flex; gap:8px; flex-wrap:wrap; }
.new-app-card button { border:none; background:var(--accent); color:#fff; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
.new-app-card button.ghost { background:var(--soft); color:var(--accent); }
</style>
</head>
<body>
<header>
  <a class="back" href="/hall">← 大厅</a>
  <h1>🛠 编码工作台</h1>
  <b id="roleName" style="font-size:13px"></b>
  <label>目标应用</label>
  <select id="appSel" onchange="onAppChange()"></select>
  <label id="toolLabel">编码工具</label>
  <select id="toolSel"></select>
  <button onclick="clearHistory()">清空记录</button>
  <button onclick="openTarget()">打开应用</button>
</header>
<main>
  <div class="tip" id="tip"></div>
  <div class="msgs" id="msgs"></div>
  <div class="inputbar">
    <textarea id="chatInput" placeholder="描述要做的改动，如：把标题颜色改成深蓝，并加一个重置按钮"></textarea>
    <button class="send" id="sendBtn" onclick="sendChat()">发送</button>
  </div>
</main>

<script>
var qs = new URLSearchParams(location.search);
// 角色由入口决定 (大厅卡片带 ?role=), 页面内不再切换: 进来是什么就是什么
var ROLE = qs.get('role') === '@persona/coding-coach' ? '@persona/coding-coach' : '@persona/app-dev';
var ROLE_NAMES = { '@persona/app-dev': '🪶 网页应用开发员', '@persona/coding-coach': '👨‍💻 编码教练' };
var appSel = document.getElementById('appSel');
var toolSel = document.getElementById('toolSel');
var chatHistory = [];
var NEW_APP = "__new__";
var inFlight = false;
var sessionState = null; // 编码教练分步引导工作流状态 (由前端携带回传, 服务无状态)

// ── 通用: 带超时与错误透传的 fetchJSON; 登录态从大厅带过来 ──
function fetchJSON(url, opts, timeoutMs) {
  var ctl = new AbortController();
  var timer = setTimeout(function() { ctl.abort(); }, timeoutMs || 30000);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal }))
    .then(function(r) {
      return r.json().catch(function() { return {}; }).then(function(d) {
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        return d;
      });
    })
    .finally(function() { clearTimeout(timer); });
}
function authH() {
  // hall_token 存 sessionStorage (与大厅同标签页导航过来, 可读到; 其他标签页/生成应用页读不到)
  var t = sessionStorage.getItem('hall_token') || '';
  return t ? { Authorization: 'Bearer ' + t } : {};
}
function relaunchIfAuthErr(e) {
  if (e && /未授权|401/.test(e.message)) { location.href = '/hall'; return true; }
  return false;
}

function isCoach() { return ROLE === '@persona/coding-coach'; }
function histKeyFor(app) { return 'wb_chat_' + ROLE + '_' + (app || '-'); }
function histKey() {
  return histKeyFor(appSel.value);
}
function stateKey() { return histKey() + '_state'; }
// ── 聊天历史云端持久化 ──
function cloudSaveHistory(key, messages) {
  fetchJSON('/app/hall/chat-history', { method: 'PUT', headers: Object.assign({'Content-Type':'application/json'}, authH()),
    body: JSON.stringify({ key: key, messages: messages.slice(-60) }) }).catch(function() {});
}
function cloudLoadHistory(key, apply) {
  fetchJSON('/app/hall/chat-history?key=' + encodeURIComponent(key), { headers: authH() })
    .then(function(d) {
      var msgs = (d.messages || []).filter(function(m) { return m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string'; });
      if (msgs.length) apply(msgs);
    }).catch(function() {});
}
function loadSessionState() {
  try { sessionState = JSON.parse(localStorage.getItem(stateKey()) || 'null') || { phase: 1 }; }
  catch (e) { sessionState = { phase: 1 }; }
}
function saveSessionState() {
  try { localStorage.setItem(stateKey(), JSON.stringify(sessionState)); } catch (e) {}
}
function onAppChange() {
  if (appSel.value === NEW_APP) enterNewAppMode();
  else {
    localStorage.removeItem('wb_pending_new'); // 切到具体应用: 清掉待确认的新应用
    pendingNewApp = null;
    localStorage.setItem('wb_app', appSel.value);
    loadHistory();
    renderMode(); // 提示文案回到「编辑模式」
  }
}

// ── 新建应用流程 ──
// 「➕ 新建应用」不先起名字: 目标应用即沙箱的 __new__ 子目录, 用户在聊天里描述需求,
// 开发员自己起名字并在该目录生成 (app-dev 会把子目录产物扁平化到大厅根目录);
// 前端检测到新应用后在对话流里给一张确认卡片 —— 用户确认名字后才切换「目标应用」,
// 并把「新建应用」这段对话的聊天记录一并迁到新应用名下。
var pendingNewApp = null; // 待用户确认的新应用文件名
function enterNewAppMode() {
  localStorage.removeItem('wb_app'); // 新建态本身不持久化, 免得下次进页面停在没有应用的状态
  loadHistory();                     // 切到「新建应用」自己的会话历史
  var pend = localStorage.getItem('wb_pending_new');
  if (pend && knownApps && knownApps.indexOf(pend) >= 0) { offerNewApp(pend); return; }
  document.getElementById('tip').textContent =
    '🆕 新建应用：直接描述你要做的应用（如「做一个记账本」）。开发员会起好名字并生成，完成后在对话里点确认即可切过去。';
}
// 把「新建应用」期间累积的聊天记录迁到新应用名下 (本地 + 云端)
function migrateHistory(fromKey, toKey) {
  if (!fromKey || fromKey === toKey) return;
  var raw = localStorage.getItem(fromKey);
  if (raw) { try { localStorage.setItem(toKey, raw); localStorage.removeItem(fromKey); } catch (e) {} }
  var st = localStorage.getItem(fromKey + '_state');
  if (st) { try { localStorage.setItem(toKey + '_state', st); localStorage.removeItem(fromKey + '_state'); } catch (e) {} }
  var msgs = [];
  try { msgs = JSON.parse(raw || '[]') || []; } catch (e) { msgs = []; }
  if (msgs.length) { cloudSaveHistory(toKey, msgs); cloudSaveHistory(fromKey, []); return; }
  // 本地没有 (换过浏览器/清过本地存储): 从云端兜底迁移一次
  cloudLoadHistory(fromKey, function(cloud) {
    if (!cloud.length) return;
    cloudSaveHistory(toKey, cloud);
    cloudSaveHistory(fromKey, []);
  });
}
// 用户确认名字: 迁移聊天记录 → 刷新列表 → 选中该应用
function confirmNewApp(file, fromKey) {
  migrateHistory(fromKey, histKeyFor(file));
  return loadApps(true, file).then(function() {
    pendingNewApp = null;
    localStorage.removeItem('wb_pending_new');
    if (appSel.value !== file) { // 列表里没有 (如普通用户看不到未授权应用): 补一项再选中
      var opt = document.createElement('option');
      opt.value = file;
      opt.textContent = file.replace(/\.html$/, '');
      appSel.appendChild(opt);
      appSel.value = file;
    }
    localStorage.setItem('wb_app', file);
    loadHistory();
    document.getElementById('tip').textContent =
      '📌 已切换到「' + file + '」，点「打开应用」即可查看；后续对话都是在改这个应用。';
  });
}
// 名字不合适: 走大厅的重命名接口 (PUT ?rename=), 成功后按新名字确认切换
function renameNewApp(oldFile, newName, fromKey, card) {
  var newFile = newName + '.html';
  if (!/^[\w一-龥-]+\.html$/.test(newFile)) { alert('名称只能用中文、字母、数字、下划线或短横线'); return; }
  fetchJSON('/app/hall/apps/' + encodeURIComponent(oldFile) + '?rename=' + encodeURIComponent(newFile),
    { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, authH()), body: '{}' })
    .then(function(d) {
      card.remove();
      return confirmNewApp((d && d.name) || newFile, fromKey);
    })
    .catch(function(e) {
      if (relaunchIfAuthErr(e)) return;
      alert('改名失败: ' + e.message);
    });
}
// 开发员在「新建应用」态生成了新应用 → 在对话流里给一张确认卡片 (名字先由开发员起, 用户确认或改)
function offerNewApp(file) {
  if (pendingNewApp === file) return; // 同一个应用不重复提示
  pendingNewApp = file;
  localStorage.setItem('wb_pending_new', file);
  var fromKey = histKey();            // 「新建应用」态的历史键
  var label = file.replace(/\.html$/, '');
  var box = document.getElementById('msgs');
  var card = document.createElement('div');
  card.className = 'new-app-card';
  var title = document.createElement('div');
  title.className = 'title';
  title.textContent = '🆕 开发员已生成新应用「' + label + '」';
  var sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = '确认后把「目标应用」切到 ' + file + '，并把新建这段对话的记录一起带过去。';
  var row = document.createElement('div');
  row.className = 'row';
  var okBtn = document.createElement('button');
  okBtn.textContent = '✅ 就用「' + label + '」，切过去';
  okBtn.onclick = function() { card.remove(); confirmNewApp(file, fromKey); };
  var renameBtn = document.createElement('button');
  renameBtn.className = 'ghost';
  renameBtn.textContent = '✏️ 换个名字';
  renameBtn.onclick = function() {
    var nn = prompt('新应用名称（中文或英文，不用带 .html）:', label);
    if (nn === null) return;
    nn = nn.trim();
    if (!nn || nn === label) return;
    renameNewApp(file, nn, fromKey, card);
  };
  row.appendChild(okBtn);
  row.appendChild(renameBtn);
  card.appendChild(title);
  card.appendChild(sub);
  card.appendChild(row);
  box.appendChild(card);
  box.scrollTop = 1e9;
  document.getElementById('tip').textContent =
    '🆕 新应用「' + file + '」已生成，确认名字后即可切换「目标应用」。';
}
// 每轮对话后检查列表新增: 新建态下直接给确认卡片; 用户已切到具体应用则记下来, 切回时再给
function claimFreshApps(fresh) {
  if (isCoach() || !fresh || !fresh.length) return;
  if (appSel.value !== NEW_APP) { // 不动用户的目标应用, 只记录待确认
    localStorage.setItem('wb_pending_new', fresh[0].name);
    document.getElementById('tip').textContent =
      '🆕 检测到新应用「' + fresh[0].name.replace(/\.html$/, '') + '」已生成；切回「➕ 新建应用」即可确认切换。';
    return;
  }
  offerNewApp(fresh[0].name);     // 列表按 mtime 倒序, 取最近生成的那个
}

// ── 模式 ──
function renderMode() {
  var coach = isCoach();
  // 编码教练: 教学模式, 无工具/无需目标应用
  toolSel.parentElement && (document.getElementById('toolLabel').style.display = coach ? 'none' : '');
  toolSel.style.display = coach ? 'none' : '';
  document.getElementById('tip').textContent = coach
    ? '💡 引导模式：教练分 5 步引导你设计一个案例应用（只设计，不实际生成/保存），最后产出完整提示词，交给「网页应用开发员」落地。'
    : '💡 编辑模式：AI 会真实修改「目标应用」的代码文件（改动前自动备份）。可选择「新建应用」从零开始。';
}

// ── 选择器 ──
var knownApps = null; // 上次拉到的应用名列表 (用于识别本次新生成的应用; null=尚未加载)
function loadApps(keep, selectName) {
  // keep=true: 刷新列表时保持当前选中, 不回退到 "-- 选择应用 --"
  // selectName: 刷新后强制选中该应用 (用于刚创建的新应用)
  var prev = keep ? appSel.value : '';
  return fetchJSON('/app/hall/apps', { headers: authH() }).then(function(d) {
    var apps = d.apps || [];
    var fresh = knownApps ? apps.filter(function(a){ return knownApps.indexOf(a.name) < 0; }) : [];
    knownApps = apps.map(function(a){ return a.name; });
    var wanted = selectName || (keep ? prev : (qs.get('app') || localStorage.getItem('wb_app')));
    appSel.innerHTML = '<option value="">-- 选择应用 --</option><option value="__new__">➕ 新建应用</option>' + apps.map(function(a){
      return '<option value="'+a.name+'">'+a.name.replace('.html','')+'</option>';
    }).join('');
    if (wanted === NEW_APP) appSel.value = NEW_APP; // 新建态: 刷新列表后仍停在「➕ 新建应用」
    else if (wanted && apps.some(function(a){ return a.name === wanted; })) appSel.value = wanted;
    return fresh;
  }).catch(function(e){ relaunchIfAuthErr(e); return []; });
}
function loadTools() {
  fetchJSON('/app/hall/tools', { headers: authH() }).then(function(d) {
    var avail = (d.tools||[]).filter(function(t){ return t.available; });
    var wanted = qs.get('tool') || localStorage.getItem('wb_tool');
    toolSel.innerHTML = avail.map(function(t){
      return '<option value="'+t.id+'">'+t.name+(t.version?' · '+t.version:'')+'</option>';
    }).join('') || '<option value="">(无可用工具)</option>';
    if (wanted && avail.some(function(t){ return t.id === wanted; })) toolSel.value = wanted;
  }).catch(function(e){ relaunchIfAuthErr(e); });
}

// ── 聊天记录持久化 (按 角色+模式+应用+工具) ──
function loadHistory() {
  var raw = localStorage.getItem(histKey());
  chatHistory = [];
  try { chatHistory = JSON.parse(raw || '[]') || []; } catch (e) { chatHistory = []; }
  var box = document.getElementById('msgs');
  box.innerHTML = '';
  chatHistory.forEach(function(m){ addMsg(m.role, m.content, true); });
  // 云端历史: 比本地长则以云端为准重渲染(退出/换浏览器/清本地存储都不丢)
  cloudLoadHistory(histKey(), function(msgs) {
    if (msgs.length <= chatHistory.length) return;
    chatHistory = msgs.slice();
    box.innerHTML = '';
    chatHistory.forEach(function(m){ addMsg(m.role, m.content, true); });
    box.scrollTop = 1e9;
    if (pendingNewApp && appSel.value === NEW_APP) { // 重渲染冲掉了确认卡片, 补回来
      var f = pendingNewApp; pendingNewApp = null; offerNewApp(f);
    }
  });
  if (!chatHistory.length) {
    addMsg('bot', isCoach()
      ? '你好，我是编码教练 👨‍💻\n我会分 5 步引导你设计一个案例应用：需求理解 → 功能清单 → 页面与数据 → 交互与边界 → 确认出完整提示词。全程只做设计引导，不会真正生成或保存应用。\n先说说你想做什么？给谁用、解决什么问题？'
      : '选择目标应用后，描述要做的改动。', true); // 欢迎语不写入历史/上下文
  }
  loadSessionState();
  box.scrollTop = 1e9;
}
function saveHistory() {
  localStorage.setItem(histKey(), JSON.stringify(chatHistory.slice(-60)));
  cloudSaveHistory(histKey(), chatHistory);
}
function clearHistory() {
  if (inFlight) { alert('当前有请求进行中，等回复完成后再清空'); return; }
  if (!confirm('清空当前组合的聊天记录？')) return;
  chatHistory = [];
  localStorage.removeItem(histKey());
  localStorage.removeItem(stateKey()); // 引导进度一并重置
  cloudSaveHistory(histKey(), []);
  loadHistory();
}
function addMsg(role, text, skipSave) {
  var el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  el.textContent = text;
  var box = document.getElementById('msgs');
  box.appendChild(el);
  box.scrollTop = 1e9;
  // 存储用 assistant (LLM 语境); 状态气泡/欢迎语/错误提示 skipSave 不入历史
  if (!skipSave && (role === 'user' || role === 'bot')) {
    chatHistory.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
    saveHistory();
  }
  return el;
}
function openTarget() {
  if (!appSel.value) { alert('请先选择目标应用'); return; }
  if (appSel.value === NEW_APP) { alert('当前选中的是「➕ 新建应用」，请先创建或选择一个具体应用'); return; }
  window.open('/apps/' + encodeURIComponent(appSel.value), '_blank');
}

// ── 教练进度条 / 完整提示词卡片 (均不入聊天历史) ──
function appendBar(text) {
  var box = document.getElementById('msgs');
  var el = document.createElement('div');
  el.className = 'progress-bar';
  el.textContent = text;
  box.appendChild(el);
  box.scrollTop = 1e9;
}
function appendCopyPrompt(prompt) {
  var box = document.getElementById('msgs');
  var wrap = document.createElement('div');
  wrap.className = 'final-prompt';
  var pre = document.createElement('pre');
  pre.textContent = prompt;
  var btn = document.createElement('button');
  btn.textContent = '📋 复制完整提示词';
  btn.onclick = function() {
    var done = function() { btn.textContent = '✓ 已复制，回大厅发给「网页应用开发员」即可真正生成'; btn.disabled = true; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(prompt).then(done, done);
    else done();
  };
  var hint = document.createElement('div');
  hint.className = 'sub';
  hint.textContent = '教练只负责设计引导，不会真正生成/保存应用；落地请把提示词交给「网页应用开发员」。';
  wrap.appendChild(pre);
  wrap.appendChild(btn);
  wrap.appendChild(hint);
  box.appendChild(wrap);
  box.scrollTop = 1e9;
}

// ── 发送 ──
function sendChat() {
  if (inFlight) return; // 按钮禁用拦不住回车, 入口统一拦并发
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  if (!isCoach() && !appSel.value) { alert('请先选择目标应用（或新建一个）'); return; }
  if (!isCoach() && !toolSel.value) { alert('当前电脑没有可用的编码工具'); return; }
  inFlight = true;
  var btn = document.getElementById('sendBtn');
  btn.disabled = true;
  addMsg('user', text);
  input.value = '';
  var hp = chatHistory.slice(-10); // addMsg 已入历史, 直接截取
  var coach = isCoach();
  var statusEl = addMsg('bot', coach
    ? '⏳ 思考中…'
    : '🛠 工作中…（' + (toolSel.options[toolSel.selectedIndex]||{text:''}).text + '，可能需要 1-3 分钟）', true); // 状态气泡不写入历史
  var message = coach ? text : (appSel.value === NEW_APP
    ? '【新建应用】' + text + '\n\n（新应用请直接生成在当前工作目录，文件名为 <应用名>.html）'
    : '目标应用文件: ' + appSel.value + '\n\n' + text);
  fetchJSON('/hall/chat', { method:'POST', headers: Object.assign({ 'Content-Type':'application/json' }, authH()),
    body: JSON.stringify(Object.assign({
      role: ROLE,
      message: message,
      history: hp,
      session_id: 'wb-' + ROLE + '-' + appSel.value + '-' + toolSel.value
    }, coach
      ? { session_state: sessionState || { phase: 1 } } // 教练: 携带引导工作流状态
      : { driver: toolSel.value, app: appSel.value })) },
    coach ? 3 * 60 * 1000 : 11 * 60 * 1000) // 开发员对齐服务端编码 Agent 上限 10 分钟; 教练纯 LLM 3 分钟
    .then(function(d) {
      statusEl.remove();
      var reply = d.response || '(无回复)';
      if (d.degraded) reply += '\n\n（⚠ 降级回复：以上为占位内容，请稍后重试）';
      addMsg('bot', reply);
      if (coach && d.session_state) { sessionState = d.session_state; saveSessionState(); }
      if (coach && !d.done && d.progress && d.phase_title) {
        appendBar('📍 已完成 ' + d.progress + ' · 当前第 ' + d.phase + ' 阶段「' + d.phase_title + '」');
      }
      if (coach && d.done && d.final_prompt) {
        appendBar('✅ 设计完成！完整提示词已生成');
        appendCopyPrompt(d.final_prompt);
      }
      // 刷新列表但保持当前选中; 「新建应用」态下开发员刚生成/搬来了应用 → 给确认卡片
      // (名字先由开发员起, 用户确认或改名之后才切换「目标应用」并带走这段对话)
      loadApps(true).then(claimFreshApps);
    })
    .catch(function(e) {
      statusEl.remove();
      if (relaunchIfAuthErr(e)) return;
      addMsg('bot', '请求失败: ' + (e.name === 'AbortError'
        ? '等待超时（11 分钟）。可能是编码工具卡死，请检查服务端后重试'
        : e.message), true); // 错误提示如实展示, 但不写入历史
      // 超时/中断时编码 agent 可能已经把应用生成好了: 也刷新一次, 免得新应用没人认领
      loadApps(true).then(claimFreshApps);
    })
    .finally(function(){ inFlight = false; btn.disabled = false; input.focus(); });
}
document.getElementById('chatInput').addEventListener('keydown', function(e){
  // 中文输入法选词的回车 (isComposing/keyCode 229) 不当作发送
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
[appSel, toolSel].forEach(function(sel) {
  sel.addEventListener('change', function() {
    localStorage.setItem('wb_tool', toolSel.value);
    // 新建态由 enterNewAppMode 自己处理 (它会渲染确认卡片), 这里不能重渲染, 否则卡片被冲掉
    if (appSel.value === NEW_APP) return;
    localStorage.setItem('wb_app', appSel.value);
    loadHistory();
  });
});

document.getElementById('roleName').textContent = ROLE_NAMES[ROLE] || ROLE;
if (isCoach()) { appSel.style.display = 'none'; document.querySelector('header label').style.display = 'none'; }
loadApps().then(function() {
  // 列表回来才知道选中了哪个应用, 这时再按它的历史键渲染 (否则会渲染成空历史)
  if (appSel.value === NEW_APP) { enterNewAppMode(); return; } // 带 ?app=__new__ 进入时直接进新建态
  // 刷新后还有待确认的新应用: 自动回到「新建应用」态, 让确认卡片重新出现
  if (!appSel.value && localStorage.getItem('wb_pending_new')) { appSel.value = NEW_APP; enterNewAppMode(); return; }
  loadHistory();
});
loadTools();
renderMode();
</script>
