<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppBase · 编码工作台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink:#1e293b; --ink2:#64748b; --line:#e8ecf4; --accent:#4f46e5; --soft:#eef0fe; --rose:#f43f5e; --rose-soft:#fde9ed; }
body { font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6fb; color:var(--ink); height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
header { background:linear-gradient(120deg,#312e81,#4f46e5 55%,#7c3aed); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
header h1 { font-size:16px; font-weight:700; margin-right:6px; }
header label { font-size:12px; opacity:.85; }
header select, header button { font-family:inherit; font-size:12.5px; border:none; border-radius:8px; padding:7px 10px; cursor:pointer; }
header select { background:rgba(255,255,255,.16); color:#fff; outline:none; }
header select option { color:var(--ink); }
header button { background:rgba(255,255,255,.2); color:#fff; font-weight:600; }
header button:hover { background:rgba(255,255,255,.32); }
.back { text-decoration:none; color:#fff; font-size:12.5px; opacity:.85; }
.back:hover { opacity:1; }
main { flex:1; display:flex; flex-direction:column; max-width:980px; width:100%; margin:0 auto; padding:16px 20px 0; overflow:hidden; }
.msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 2px 14px; }
.msg { max-width:80%; padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 2px rgba(15,23,42,.05); }
.msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
.msg.bot { align-self:flex-start; background:#fff; border:1px solid var(--line); }
.msg.sys { align-self:center; background:transparent; color:var(--ink2); font-size:12px; }
.inputbar { display:flex; gap:10px; padding:14px 0 18px; }
.inputbar textarea { flex:1; border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; font-family:inherit; font-size:13.5px; resize:none; height:64px; outline:none; }
.inputbar textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3.5px rgba(99,102,241,.12); }
.send { border:none; background:var(--accent); color:#fff; border-radius:12px; padding:0 24px; font-weight:700; cursor:pointer; font-family:inherit; font-size:13.5px; }
.send:disabled { opacity:.55; cursor:wait; }
.tip { font-size:11.5px; color:var(--ink2); padding:0 2px 8px; }
.hist-btn { background:rgba(255,255,255,.2); }
</style>
</head>
<body>
<header>
  <a class="back" href="/hall">← 大厅</a>
  <h1>🛠 编码工作台</h1>
  <label>角色</label><select id="roleSel"></select>
  <label>目标应用</label><select id="appSel"></select>
  <label>编码工具</label><select id="toolSel"></select>
  <button class="hist-btn" onclick="clearHistory()">清空记录</button>
  <button onclick="openTarget()">打开应用</button>
</header>
<main>
  <div class="tip">💡 选择目标应用与编码工具后描述改动；AI 会直接修改该应用文件。聊天记录按「角色 + 应用 + 工具」自动保存。</div>
  <div class="msgs" id="msgs"></div>
  <div class="inputbar">
    <textarea id="chatInput" placeholder="描述要做的改动，如：把标题颜色改成深蓝，并加一个重置按钮"></textarea>
    <button class="send" id="sendBtn" onclick="sendChat()">发送</button>
  </div>
</main>

<script>
var ROLES = [
  { id:'@persona/codex-chat', icon:'🪶', name:'网页应用生成器' },
  { id:'@persona/coder', icon:'👨‍💻', name:'编码助手' }
];
var qs = new URLSearchParams(location.search);
var roleSel = document.getElementById('roleSel');
var appSel = document.getElementById('appSel');
var toolSel = document.getElementById('toolSel');
var chatHistory = [];

// ── 初始化选择器 ──
function initRole() {
  var wanted = qs.get('role') || ROLES[0].id;
  roleSel.innerHTML = ROLES.map(function(r){ return '<option value="'+r.id+'">'+r.icon+' '+r.name+'</option>'; }).join('');
  roleSel.value = wanted;
  if (roleSel.selectedIndex < 0) roleSel.selectedIndex = 0;
}
function loadApps() {
  fetch('/app/hall/apps').then(function(r){ return r.json(); }).then(function(d) {
    var wanted = qs.get('app') || localStorage.getItem('wb_app');
    appSel.innerHTML = '<option value="">-- 选择应用 --</option>' + (d.apps||[]).map(function(a){
      return '<option value="'+a.name+'">'+a.name.replace('.html','')+'</option>';
    }).join('');
    if (wanted && (d.apps||[]).some(function(a){ return a.name === wanted; })) appSel.value = wanted;
  });
}
function loadTools() {
  fetch('/app/hall/tools').then(function(r){ return r.json(); }).then(function(d) {
    var avail = (d.tools||[]).filter(function(t){ return t.available; });
    var wanted = qs.get('tool') || localStorage.getItem('wb_tool');
    toolSel.innerHTML = avail.map(function(t){
      return '<option value="'+t.id+'">'+t.name+(t.version?' · '+t.version:'')+'</option>';
    }).join('') || '<option value="">(无可用工具)</option>';
    if (wanted && avail.some(function(t){ return t.id === wanted; })) toolSel.value = wanted;
  });
}
function histKey() {
  return 'wb_chat_' + roleSel.value + '_' + (appSel.value||'-') + '_' + (toolSel.value||'-');
}
function currentRole() {
  return ROLES.find(function(r){ return r.id === roleSel.value; }) || ROLES[0];
}

// ── 聊天记录持久化 ──
function loadHistory() {
  var raw = localStorage.getItem(histKey());
  var box = document.getElementById('msgs');
  box.innerHTML = '';
  chatHistory = [];
  try { chatHistory = JSON.parse(raw || '[]') || []; } catch (e) { chatHistory = []; }
  chatHistory.forEach(function(m){ addMsg(m.role, m.content, true); });
  if (!chatHistory.length) {
    var r = currentRole();
    addMsg('bot', '我是' + r.name + '。选择好目标应用和编码工具后，直接描述要做的改动。');
  }
  box.scrollTop = 1e9;
}
function saveHistory() {
  localStorage.setItem(histKey(), JSON.stringify(chatHistory.slice(-60)));
}
function clearHistory() {
  if (!confirm('清空当前「角色 + 应用 + 工具」组合的聊天记录？')) return;
  chatHistory = [];
  localStorage.removeItem(histKey());
  loadHistory();
}
function addMsg(role, text, skipSave) {
  var el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  var box = document.getElementById('msgs');
  box.appendChild(el);
  box.scrollTop = 1e9;
  if (!skipSave && (role === 'user' || role === 'bot')) {
    chatHistory.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
    saveHistory();
  }
}

// ── 发送 ──
function sendChat() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  if (!appSel.value) { alert('请先选择目标应用'); return; }
  if (!toolSel.value) { alert('当前电脑没有可用的编码工具'); return; }
  addMsg('user', text);
  input.value = '';
  var btn = document.getElementById('sendBtn');
  btn.disabled = true;
  var hp = chatHistory.slice(-10);
  addMsg('bot', '工作中…（' + toolSel.options[toolSel.selectedIndex].text + '，可能需要 1-3 分钟）');
  fetch('/hall/chat', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      role: roleSel.value,
      message: '目标应用文件: ' + appSel.value + '\n\n' + text,
      history: hp,
      session_id: 'wb-' + roleSel.value + '-' + appSel.value + '-' + toolSel.value,
      driver: toolSel.value,
      app: appSel.value
    }) })
    .then(function(r){ return r.json(); }).then(function(d) {
      var box = document.getElementById('msgs');
      box.lastChild.remove();
      addMsg('bot', d.response || '(无回复)');
      loadApps();
    })
    .catch(function(e) {
      var box = document.getElementById('msgs');
      box.lastChild.remove();
      addMsg('bot', '请求失败: ' + e.message);
    })
    .finally(function(){ btn.disabled = false; input.focus(); });
}
function openTarget() {
  if (!appSel.value) { alert('请先选择目标应用'); return; }
  window.open('/apps/' + encodeURIComponent(appSel.value), '_blank');
}
document.getElementById('chatInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
[roleSel, appSel, toolSel].forEach(function(sel) {
  sel.addEventListener('change', function() {
    localStorage.setItem('wb_app', appSel.value);
    localStorage.setItem('wb_tool', toolSel.value);
    loadHistory();
  });
});

initRole();
loadApps();
loadTools();
loadHistory();
</script>
</body>
</html>
