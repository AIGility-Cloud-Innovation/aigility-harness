<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppBase · 用户管理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink:#1e293b; --ink2:#64748b; --line:#e8ecf4; --accent:#4f46e5; --soft:#eef0fe; --rose:#f43f5e; --rose-soft:#fde9ed; --green:#10b981; --green-soft:#e7f8f1; }
body { font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6fb; color:var(--ink); min-height:100vh; padding:28px 22px 70px; -webkit-font-smoothing:antialiased; }
.shell { max-width:1080px; margin:0 auto; }
.hero { background:linear-gradient(120deg,#312e81,#4f46e5 55%,#7c3aed); border-radius:22px; padding:26px 32px; color:#fff; box-shadow:0 10px 36px rgba(49,46,129,.35); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.hero h1 { font-size:22px; }
.hero p { font-size:12.5px; color:rgba(255,255,255,.75); flex:1; min-width:200px; }
.hero button { border:none; background:rgba(255,255,255,.2); color:#fff; border-radius:10px; padding:7px 16px; font-size:12.5px; cursor:pointer; font-weight:600; font-family:inherit; }
.hero button:hover { background:rgba(255,255,255,.32); }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; margin-top:18px; overflow:hidden; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:11px 14px; font-size:12px; color:var(--ink2); border-bottom:1px solid var(--line); background:#fafbfe; }
td { padding:11px 14px; border-bottom:1px solid #f0f2f8; vertical-align:middle; }
tr:last-child td { border-bottom:none; }
.chip { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; }
.chip.admin { background:var(--green-soft); color:var(--green); }
.chip.user { background:#f1f4f9; color:var(--ink2); }
td button { border:none; border-radius:8px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-weight:600; font-family:inherit; margin-right:5px; }
.b-admin { background:var(--green-soft); color:var(--green); }
.b-demote { background:#fff3e6; color:#d97706; }
.b-pwd { background:var(--soft); color:var(--accent); }
.b-mem { background:var(--soft); color:var(--accent); }
.b-del { background:var(--rose-soft); color:var(--rose); }
.sub { font-size:11.5px; color:var(--ink2); }
.membar { display:none; padding:12px 14px; background:#fafbfe; border-bottom:1px solid var(--line); }
.membar.show { display:block; }
.membar .mrow { display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:5px 10px; font-size:12px; margin:3px 6px 3px 0; }
.membar .mrow button { border:none; background:var(--rose-soft); color:var(--rose); border-radius:6px; padding:2px 7px; font-size:11px; cursor:pointer; font-family:inherit; }
.empty { text-align:center; padding:40px; color:var(--ink2); }
#msg { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:12.5px; padding:9px 18px; border-radius:10px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; }
</style>
</head>
<body>
<div class="shell">
  <div class="hero">
    <h1>👥 用户管理</h1>
    <p>管理 AppBase 全部登录账号：管理员身份、密码重置、应用成员关系、删除账号</p>
    <button onclick="location.href='/hall'">← 返回大厅</button>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>邮箱</th><th>身份</th><th>注册时间</th><th>应用归属</th><th>成员关系</th><th>操作</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)">
      <b style="font-size:14px;flex:1">🔑 应用内账号</b>
      <span class="sub" style="margin-right:10px">各应用自己的登录账号（用户名+密码），跨应用统一管理</span>
      <button class="b-pwd" onclick="loadAppAccounts()">⟳ 刷新</button>
      <button class="b-admin" style="margin-left:8px" onclick="openAccAdd()">➕ 添加账号</button>
    </div>
    <div id="accAddBar" style="display:none;padding:12px 14px;background:#fafbfe;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select id="naApp" class="b-mem" style="padding:6px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff;outline:none"></select>
        <input id="naUser" placeholder="用户名" style="width:130px;padding:6px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;outline:none">
        <input id="naPass" type="password" placeholder="密码(至少4位)" style="width:130px;padding:6px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;outline:none">
        <button class="b-admin" onclick="addAppAccount()">添加</button>
        <button class="b-mem" onclick="document.getElementById('accAddBar').style.display='none'">收起</button>
      </div>
    </div>
    <table>
      <thead><tr><th>所属应用</th><th>用户名</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="accTbody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)">
      <b style="font-size:14px;flex:1">📜 审计日志</b>
      <span class="sub" style="margin-right:10px">敏感操作留痕：登录 / 改密 / 提权 / 删除 / 应用变更（最近 100 条）</span>
      <button class="b-pwd" onclick="loadAudit()">⟳ 刷新</button>
    </div>
    <table>
      <thead><tr><th style="width:130px">时间</th><th style="width:190px">操作者</th><th style="width:150px">动作</th><th>对象 / 说明</th></tr></thead>
      <tbody id="auditBody"><tr><td colspan="4" class="empty">点「刷新」加载</td></tr></tbody>
    </table>
  </div>
</div>
<div id="msg"></div>

<script>
var users = [];
// 与大厅同一标签页导航而来, sessionStorage 里带着 hall_token; 页面门禁另有 httpOnly cookie 兜底
function ah() {
  var t = sessionStorage.getItem('hall_token') || '';
  return t ? { Authorization: 'Bearer ' + t } : {};
}
function toast(t) {
  var el = document.getElementById('msg');
  el.textContent = t; el.style.opacity = 1;
  clearTimeout(el._t); el._t = setTimeout(function(){ el.style.opacity = 0; }, 2600);
}
function fetchJSON(url, opts, timeoutMs) {
  var ctl = new AbortController();
  var timer = setTimeout(function() { ctl.abort(); }, timeoutMs || 30000);
  opts = Object.assign({}, opts);
  opts.headers = Object.assign({}, ah(), opts.headers || {});
  return fetch(url, Object.assign(opts, { signal: ctl.signal }))
    .then(function(r) {
      return r.json().catch(function() { return {}; }).then(function(d) {
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        return d;
      });
    })
    .finally(function() { clearTimeout(timer); });
}
function load() {
  fetchJSON('/app/admin/users').then(function(d) {
    users = d.users || [];
    render();
  }).catch(function(e) {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="6" class="empty">' + esc(e.message) + ' · <a href="/hall">回大厅重新登录</a></td></tr>';
  });
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function render() {
  var tb = document.getElementById('tbody');
  if (!users.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">暂无用户</td></tr>'; return; }
  tb.innerHTML = users.map(function(u) {
    return '<tr id="row-' + u.id + '">'
      + '<td><b>' + esc(u.email) + '</b></td>'
      + '<td><span class="chip ' + (u.is_admin ? 'admin' : 'user') + '">' + (u.is_admin ? '管理员' : '普通用户') + '</span></td>'
      + '<td class="sub">' + new Date(u.created_at).toLocaleString('zh-CN', {year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) + '</td>'
      + '<td>' + u.app_count + ' 个</td>'
      + '<td><span class="sub">' + u.member_count + ' 个应用 <a href="javascript:void(0)" onclick="toggleMem(\'' + u.id + '\')">查看</a></span></td>'
      + '<td>'
      + (u.is_admin
          ? '<button class="b-demote" onclick="setAdmin(\'' + u.id + '\', false)">取消管理员</button>'
          : '<button class="b-admin" onclick="setAdmin(\'' + u.id + '\', true)">设为管理员</button>')
      + '<button class="b-pwd" onclick="resetPwd(this, \'' + u.id + '\')">重置密码</button>'
      + '<button class="b-mem" onclick="toggleMem(\'' + u.id + '\')">成员关系</button>'
      + '<button class="b-del" onclick="armConfirm(this, function(){ delUser(\'' + u.id + '\') })">删除</button>'
      + '</td></tr>'
      + '<tr class="memrow" id="mem-' + u.id + '" style="display:none"><td colspan="6" style="padding:0"><div class="membar" id="membar-' + u.id + '">加载中…</div></td></tr>';
  }).join('');
}
// 两击确认 (内嵌浏览器可能禁用 confirm/prompt, 全部改内联交互)
function armConfirm(btn, fn) {
  if (btn.getAttribute('data-armed') === '1') {
    btn.removeAttribute('data-armed');
    btn.textContent = btn.getAttribute('data-label');
    fn();
    return;
  }
  btn.setAttribute('data-armed', '1');
  btn.setAttribute('data-label', btn.textContent);
  btn.textContent = '确认?';
  setTimeout(function() {
    if (btn.getAttribute('data-armed') === '1') {
      btn.removeAttribute('data-armed');
      btn.textContent = btn.getAttribute('data-label');
    }
  }, 3000);
}
function setAdmin(id, val) {
  var u = users.find(function(x){ return x.id === id; });
  if (!val && !confirm('确定取消「' + u.email + '」的管理员身份？')) return;
  fetchJSON('/app/admin/users/' + id + '/admin', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ is_admin: val })
  }).then(function() { toast(val ? '✓ 已设为管理员' : '✓ 已取消管理员'); load(); })
    .catch(function(e) { toast('✗ ' + e.message); });
}
// 内联重置密码: 点击后按钮区域原地变成 密码输入 + 确定/取消 (替代 prompt)
function resetPwd(btn, id) {
  var u = users.find(function(x){ return x.id === id; });
  var cell = btn.parentNode;
  cell.innerHTML = '<input id="np-' + id + '" type="password" placeholder="新密码(至少6位)" '
    + 'style="width:130px;padding:4px 7px;border:1.5px solid var(--line);border-radius:7px;font-size:11.5px;outline:none;margin-right:5px">'
    + '<button class="b-admin" onclick="confirmUserPwd(\'' + id + '\')">确定</button>'
    + '<button class="b-mem" onclick="render()">取消</button>';
  var input = document.getElementById('np-' + id);
  input.focus();
  input.addEventListener('keydown', function(e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') confirmUserPwd(id);
  });
  void u;
}
function confirmUserPwd(id) {
  var np = document.getElementById('np-' + id).value;
  if (np.length < 6) return toast('✗ 新密码至少 6 位');
  fetchJSON('/app/admin/users/' + id + '/password', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ newPassword: np })
  }).then(function() { toast('✓ 密码已重置'); render(); })
    .catch(function(e) { toast('✗ ' + e.message); });
}
function toggleMem(id) {
  var tr = document.getElementById('mem-' + id);
  var show = tr.style.display === 'none';
  tr.style.display = show ? '' : 'none';
  if (show) loadMem(id);
}
function loadMem(id) {
  var bar = document.getElementById('membar-' + id);
  fetchJSON('/app/admin/users/' + id + '/memberships').then(function(d) {
    var ms = d.memberships || [];
    bar.innerHTML = ms.length
      ? '被添加到的应用：' + ms.map(function(m) {
          return '<span class="mrow">' + esc(m.app_id)
            + '<button onclick="delMem(\'' + id + '\',\'' + esc(m.app_id) + '\')">移出</button></span>';
        }).join('')
      : '<span class="sub">没有被添加到任何应用（若为普通用户则看不到应用）</span>';
  }).catch(function(e) { bar.textContent = '加载失败: ' + e.message; });
}
function delMem(id, appId) {
  fetchJSON('/app/admin/users/' + id + '/member?app=' + encodeURIComponent(appId), { method: 'DELETE' })
    .then(function() { toast('✓ 已移出'); loadMem(id); load(); })
    .catch(function(e) { toast('✗ ' + e.message); });
}
function delUser(id) {
  var u = users.find(function(x){ return x.id === id; });
  fetchJSON('/app/admin/users/' + id, { method: 'DELETE' })
    .then(function() { toast('✓ 已删除 ' + u.email); load(); })
    .catch(function(e) { toast('✗ ' + e.message); });
}
function loadAudit() {
  fetchJSON('/app/admin/audit?limit=100').then(function(d) {
    var rows = d.entries || [];
    document.getElementById('auditBody').innerHTML = rows.length
      ? rows.map(function(e) {
          return '<tr>'
            + '<td class="sub">' + new Date(e.created_at).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) + '</td>'
            + '<td>' + esc(e.actor) + '</td>'
            + '<td><span class="chip user" style="font-family:Consolas,monospace">' + esc(e.action) + '</span></td>'
            + '<td class="sub">' + esc(e.target || '') + (e.detail ? ' · ' + esc(e.detail) : '') + '</td>'
            + '</tr>';
        }).join('')
      : '<tr><td colspan="4" class="empty">暂无记录</td></tr>';
  }).catch(function(e) {
    document.getElementById('auditBody').innerHTML =
      '<tr><td colspan="4" class="empty">加载失败: ' + esc(e.message) + '</td></tr>';
  });
}
// ── 应用内账号 (全部应用统一管理; 数据来自各应用的 app_accounts) ──
var appAccounts = [];
var accAppOptions = [];   // 可选应用列表
var accEditId = null;     // 内联重置中的账号 id
function loadAppAccounts() {
  fetchJSON('/app/admin/app-accounts').then(function(d) {
    appAccounts = d.accounts || [];
    renderAppAccounts();
  }).catch(function(e) { toast('✗ 应用账号加载失败: ' + e.message); });
}
function ensureAppOptions(cb) {
  if (accAppOptions.length) return cb();
  fetchJSON('/app/hall/apps', { headers: ah() }).then(function(d) {
    accAppOptions = (d.apps || []).map(function(a) { return a.name; });
    cb();
  }).catch(function() { cb(); });
}
function renderAppAccounts() {
  var tb = document.getElementById('accTbody');
  if (!tb) return;
  if (!appAccounts.length) {
    tb.innerHTML = '<tr><td colspan="5" class="empty">暂无应用内账号</td></tr>';
    return;
  }
  tb.innerHTML = appAccounts.map(function(a) {
    var ops;
    if (accEditId === a.id) {
      ops = '<input id="ap-' + a.id + '" type="password" placeholder="新密码(至少4位)" '
        + 'style="width:120px;padding:4px 7px;border:1.5px solid var(--line);border-radius:7px;font-size:11.5px;outline:none;margin-right:5px">'
        + '<button class="b-admin" onclick="confirmAccPwd(\'' + a.id + '\')">确定</button>'
        + '<button class="b-mem" onclick="accEditId=null;renderAppAccounts()">取消</button>';
    } else {
      ops = '<button class="b-pwd" onclick="accEditId=\'' + a.id + '\';renderAppAccounts()">重置密码</button>'
        + '<button class="b-del" onclick="armConfirm(this, function(){ delAppAcc(\'' + a.id + '\') })">删除</button>';
    }
    return '<tr>'
      + '<td class="sub" style="font-family:Consolas,monospace">' + esc(a.app_id) + '</td>'
      + '<td><b>' + esc(a.username) + '</b></td>'
      + '<td class="sub">' + esc(a.note || '') + '</td>'
      + '<td class="sub">' + new Date(a.created_at).toLocaleDateString() + '</td>'
      + '<td>' + ops + '</td></tr>';
  }).join('');
}
function confirmAccPwd(id) {
  var acc = appAccounts.find(function(x){ return x.id === id; });
  if (!acc) return;
  var np = document.getElementById('ap-' + id).value;
  if (np.length < 4) return toast('✗ 新密码至少 4 位');
  fetchJSON('/app/hall/manage/account/' + id + '/reset?app=' + encodeURIComponent(acc.app_id), {
    method: 'POST', headers: ah(),
    body: JSON.stringify({ newPassword: np })
  }).then(function() { toast('✓ 已重置 ' + acc.username); accEditId = null; renderAppAccounts(); })
    .catch(function(e) { toast('✗ ' + e.message); });
}
function delAppAcc(id) {
  var acc = appAccounts.find(function(x){ return x.id === id; });
  if (!acc) return;
  fetchJSON('/app/hall/manage/account/' + id + '?app=' + encodeURIComponent(acc.app_id), {
    method: 'DELETE', headers: ah()
  }).then(function() { toast('✓ 已删除 ' + acc.username); loadAppAccounts(); })
    .catch(function(e) { toast('✗ ' + e.message); });
}
function addAppAccount() {
  var app = document.getElementById('naApp').value;
  var un = document.getElementById('naUser').value.trim();
  var pw = document.getElementById('naPass').value;
  if (!app || !un) return toast('✗ 请选择应用并填写用户名');
  if (pw.length < 4) return toast('✗ 密码至少 4 位');
  fetchJSON('/app/hall/manage/account?app=' + encodeURIComponent(app), {
    method: 'POST', headers: ah(),
    body: JSON.stringify({ username: un, password: pw })
  }).then(function() {
    toast('✓ 已添加 ' + un);
    document.getElementById('naUser').value = ''; document.getElementById('naPass').value = '';
    loadAppAccounts();
  }).catch(function(e) { toast('✗ ' + e.message); });
}
function openAccAdd() {
  ensureAppOptions(function() {
    document.getElementById('naApp').innerHTML = accAppOptions.map(function(n) {
      return '<option value="' + esc(n) + '">' + esc(n.replace('.html','')) + '</option>';
    }).join('');
    document.getElementById('accAddBar').style.display = 'block';
  });
}
load();
loadAudit();
loadAppAccounts();
</script>
</body>
</html>
